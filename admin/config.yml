backend:
  name: github
  repo: freud1969/integra-psicologia
  branch: main

media_folder: "imagenes"
public_folder: "/imagenes"

collections:
  - name: "contenido"
    label: "Contenido de la web"
    format: "json"
    files:
      - label: "Información de Integra Psicología"
        name: "informacion"
        file: "contenido/informacion.json"
        fields:
          - label: "Título principal"
            name: "titulo"
            widget: "string"
          - label: "Presentación"
            name: "presentacion"
            widget: "text"
          - label: "Precio de la sesión (€)"
            name: "precio"
            widget: "number"
            value_type: "int"
            min: 0
          - label: "Fotografía profesional"
            name: "foto"
            widget: "image"
            required: false
          - label: "Enlace de reserva de Google Calendar"
            name: "calendar"
            widget: "string"
            pattern: ['^https://calendar\.app\.google/[A-Za-z0-9_-]+$', 'Introduce un enlace público de calendar.app.google']

